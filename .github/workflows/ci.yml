name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  # =========================================================================
  # CI: build + test + lint (push & PR, no tags)
  # =========================================================================
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap-dev

      - name: Set version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        run: |
          go build -v -ldflags="-s -w -X main.version=$VERSION" ./cmd/cli
          go build -v -ldflags="-s -w -X main.version=$VERSION" ./cmd/api

      - name: Vet
        run: go vet ./...

  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap-dev

      - name: Test
        run: go test -race -count=1 -short ./... 2>&1 | tee test-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-output.txt

  lint:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # =========================================================================
  # Release: cross-compile + GitHub Release (tag push v*)
  # =========================================================================
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cgo: 1
          - goos: linux
            goarch: arm64
            cgo: 0
          - goos: darwin
            goarch: arm64
            cgo: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libpcap (cgo builds)
        if: ${{ matrix.cgo == 1 }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap-dev

      - name: Set version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -ldflags="-s -w -X main.version=$VERSION" -o snortx ./cmd/cli
          go build -ldflags="-s -w -X main.version=$VERSION" -o snortx-api ./cmd/api
          tar -czf "snortx-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" snortx snortx-api
          sha256sum "snortx-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" > "snortx-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snortx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            snortx-*.tar.gz
            snortx-*.tar.gz.sha256

  release-publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
