linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - prealloc
    - copyloopvar
  disable-all: true

linters-settings:
  goimports:
    local-prefixes: github.com/user/snortx
  misspell:
    locale: US

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - examples
  max-issues-per-linter: 0
  max-same-issues: 0
